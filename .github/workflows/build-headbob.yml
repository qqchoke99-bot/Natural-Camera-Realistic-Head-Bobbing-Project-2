name: Build Realistic Head Bob

# The revived head-bob mod lives in headbob/ and is built per Minecraft build,
# same policy as CameraOverhaul: one .levipack per game version.

on:
  push:
    branches: [main]
    paths:
      - "headbob/**"
      - ".github/workflows/build-headbob.yml"
  pull_request:
    paths:
      - "headbob/**"
      - ".github/workflows/build-headbob.yml"
  workflow_dispatch:
    inputs:
      mcver:
        description: "Minecraft Bedrock version to build for"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - "1.26.50"
          - "1.26.62"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcver: ["1.26.50", "1.26.62"]
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure ${{ matrix.mcver }}
        if: github.event.inputs.mcver == '' || github.event.inputs.mcver == 'all' || github.event.inputs.mcver == matrix.mcver
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S headbob -B build-headbob-${{ matrix.mcver }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMCVER=${{ matrix.mcver }}

      - name: Build and package ${{ matrix.mcver }}
        id: build
        continue-on-error: true
        if: github.event.inputs.mcver == '' || github.event.inputs.mcver == 'all' || github.event.inputs.mcver == matrix.mcver
        run: |
          set -o pipefail
          cmake --build build-headbob-${{ matrix.mcver }} --target levi_package -j$(nproc) 2>&1 \
            | tee build-${{ matrix.mcver }}.log

      # CI logs live on storage that some clients cannot reach; surface the real
      # error as an annotation so it shows up in the run summary and the API.
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          python3 -c '
          import pathlib, sys
          mcver = sys.argv[1]
          log = pathlib.Path("build-" + mcver + ".log")
          text = log.read_text(errors="ignore") if log.exists() else "no log captured"
          tail = "\n".join(text.splitlines()[-40:])
          out = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=build " + mcver + "::" + out)
          ' "${{ matrix.mcver }}"
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success' && (github.event.inputs.mcver == '' || github.event.inputs.mcver == 'all' || github.event.inputs.mcver == matrix.mcver)
        with:
          name: realistic-headbob-${{ matrix.mcver }}
          path: build-headbob-${{ matrix.mcver }}/realistic_headbob-${{ matrix.mcver }}.levipack
          if-no-files-found: error
